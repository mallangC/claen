name: Supabase Keepalive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          curl -sf -X GET "https://www.thefirstclean.kr/api/keepalive" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
